# ld65 config for the relocated JU build (make build-relocated): the game and
# audio code have their own budgets, so the probes the source inserts move the
# code while the synthesis tables and the vectors keep their addresses.

MEMORY {
    HDR:     file = %O, start = $0000, size = $0010, fill = yes;
    GAME:    file = %O, start = $8000, size = $72D0, fill = yes;
    AUDIO:   file = %O, start = $F2D0, size = $0C30, fill = yes;
    TAIL:    file = %O, start = $FF00, size = $00FA, fill = yes;
    VECTORS: file = %O, start = $FFFA, size = $0006, fill = yes;
    CHR:     file = %O, start = $0000, size = $4000;
}

SEGMENTS {
    HEADER:     load = HDR, type = ro;
    PRG:        load = GAME, type = ro;
    AUDIO:      load = AUDIO, type = ro;
    FIXED_TAIL: load = TAIL, type = ro;
    VECTORS:    load = VECTORS, type = ro;
    CHR:        load = CHR, type = ro;
}
