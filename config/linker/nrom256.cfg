# ld65 config for a Super Mario Bros. cartridge image: the iNES header, the
# 32 KiB PRG and what follows it (the CHR and, for PlayChoice-10, its
# instruction ROM).
#
# PRG covers $8000-$FFF9 and VECTORS the NMI/RESET/IRQ triple at $FFFA-$FFFF;
# ld65 errors out rather than silently accepting a segment that does not fit.

MEMORY {
    HDR:  file = %O, start = $0000, size = $0010, fill = yes;
    ROM0: file = %O, start = $8000, size = $7FFA, fill = yes, define = yes;
    ROMV: file = %O, start = $FFFA, size = $0006, fill = yes;
    CHR:  file = %O, start = $0000, size = $4000;
}

SEGMENTS {
    HEADER:  load = HDR, type = ro;
    PRG:     load = ROM0, type = ro;
    VECTORS: load = ROMV, type = ro;
    CHR:     load = CHR, type = ro;
}
