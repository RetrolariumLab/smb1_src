# ld65 config for All Night Nippon Super Mario Bros.: the 32 KiB NSMMAIN
# program file (the output file) and the three overlay files, each written to
# its own file in build/revisions/ann_fds/.

MEMORY {
    NSMMAIN:  file = %O, start = $6000, size = $7FFA, fill = yes, fillval = $FF, define = yes;
    VECTORS:  file = %O, start = $DFFA, size = $0006, fill = yes, fillval = $FF;
    NSMDATA2: file = "build/revisions/ann_fds/NSMDATA2.bin", start = $C470, size = $0E00, fill = yes, fillval = $FF;
    NSMDATA3: file = "build/revisions/ann_fds/NSMDATA3.bin", start = $C5D0, size = $0D12, fill = yes, fillval = $FF;
    NSMDATA4: file = "build/revisions/ann_fds/NSMDATA4.bin", start = $C296, size = $0DF0, fill = yes, fillval = $FF;
}

SEGMENTS {
    PRG:      load = NSMMAIN, type = rw;
    VECTORS:  load = VECTORS, type = rw;
    NSMDATA2: load = NSMDATA2, type = rw;
    NSMDATA3: load = NSMDATA3, type = rw;
    NSMDATA4: load = NSMDATA4, type = rw;
}
