# ld65 config for Super Mario Bros. 2: the four program files of the disk,
# each written to its own file in build/revisions/smb2_jp_fds/ at the size the
# disk gives it.

MEMORY {
    SM2MAIN: file = "build/revisions/smb2_jp_fds/SM2MAIN.bin", start = $6000, size = $8000, fill = yes;
    SM2DATA2: file = "build/revisions/smb2_jp_fds/SM2DATA2.bin", start = $C470, size = $0E2F, fill = yes;
    SM2DATA3: file = "build/revisions/smb2_jp_fds/SM2DATA3.bin", start = $C5D0, size = $0CCF, fill = yes;
    SM2DATA4: file = "build/revisions/smb2_jp_fds/SM2DATA4.bin", start = $C2B4, size = $0F4C, fill = yes;
}

SEGMENTS {
    SM2MAIN: load = SM2MAIN, type = ro;
    SM2DATA2: load = SM2DATA2, type = ro;
    SM2DATA3: load = SM2DATA3, type = ro;
    SM2DATA4: load = SM2DATA4, type = ro;
}
